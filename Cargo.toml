[workspace]
resolver = "3"
members = ["veil-core", "veil-cli", "experiments/puf-sim"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ashwinsk01/veil"

[profile.release]
overflow-checks = true
lto = true
codegen-units = 1
panic = "abort"
