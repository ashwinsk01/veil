name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal \
            --component clippy,rustfmt --target riscv32imac-unknown-none-elf
          rustup default stable
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Bare-metal build
        run: cargo build -p veil-core --target riscv32imac-unknown-none-elf --locked

  msrv:
    name: minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.87, the rust-version in Cargo.toml
        run: |
          rustup toolchain install 1.87 --profile minimal --target riscv32imac-unknown-none-elf
          rustup default 1.87
      - name: Test
        run: cargo test --workspace --locked
      - name: Bare-metal build
        run: cargo build -p veil-core --target riscv32imac-unknown-none-elf --locked

  deny:
    name: advisories, licenses and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz@0.13.2 --locked
      - name: Fuzz each target for a minute
        run: |
          for target in bytes tamper words; do
            cargo +nightly fuzz run "$target" -- -max_total_time=60 -max_len=12000
          done
